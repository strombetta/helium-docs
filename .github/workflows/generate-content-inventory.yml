name: Generate content inventory

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/toc.yml'
      - 'scripts/generate_content_inventory.py'
      - 'scripts/tests/test_generate_content_inventory.py'
      - '.github/workflows/generate-content-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate inventory
        run: python3 scripts/generate_content_inventory.py --output-dir _inventory

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: content-inventory
          path: _inventory
          if-no-files-found: error
