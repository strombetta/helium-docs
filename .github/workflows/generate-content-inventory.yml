name: Generate content inventory

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/toc.yml'
      - 'scripts/generate_content_inventory.py'
      - 'scripts/tests/test_generate_content_inventory.py'
      - '.github/workflows/generate-content-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate inventory
        run: python3 scripts/generate_content_inventory.py

      - name: Commit generated inventory
        shell: bash
        run: |
          git add planning/content-inventory.yml planning/url-migration-map.yml planning/content-coverage.md
          if git diff --cached --quiet; then
            echo "Inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: generate content inventory"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
