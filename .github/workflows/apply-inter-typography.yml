name: Apply Inter typography

on:
  pull_request:
    paths:
      - '.github/workflows/apply-inter-typography.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply typography changes
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path('templates/helium/public/main.css')
          css = css_path.read_text(encoding='utf-8')

          new_font_face = '''@font-face {
            font-family: "Inter";
            src: url("./fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC,
              U+02C6, U+02DA, U+02DC, U+0300-0301, U+0303-0304,
              U+0308-0309, U+0323, U+0329, U+2000-206F, U+2074, U+20AC,
              U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }'''
          css, count = re.subn(
              r'@font-face \{\n  font-family: "Manrope";.*?\n\}',
              new_font_face,
              css,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('Expected one Manrope @font-face declaration.')

          old_family = '"Manrope", system-ui, -apple-system, BlinkMacSystemFont'
          new_family = '"Inter", system-ui, -apple-system, BlinkMacSystemFont'
          if old_family not in css:
              raise SystemExit('Expected Manrope font stack was not found.')
          css = css.replace(old_family, new_family, 1)

          new_typography = '''h1 {
            margin: 20px 0;
            color: rgb(22, 22, 22);
            font-size: 40px;
            font-weight: 600;
          }

          h2 {
            color: rgb(22, 22, 22);
            font-size: 32px;
            font-weight: 600;
          }

          p {
            margin: 16px 0 0;
            color: rgb(22, 22, 22);
            font-size: 16px;
            font-weight: 400;
            line-height: 1.75rem;
          }

          [data-bs-theme="dark"] h1,
          [data-bs-theme="dark"] h2,
          [data-bs-theme="dark"] p {
            color: var(--helium-text);
          }'''
          css, count = re.subn(
              r'h1 \{\n  font-weight: 700;\n\}',
              new_typography,
              css,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected one h1 declaration.')

          new_breadcrumb = '''.breadcrumb,
          .breadcrumb a,
          .breadcrumb-item,
          .breadcrumb-item.active {
            color: rgb(80, 80, 80);
            font-size: 14px;
            font-weight: 400;
          }

          [data-bs-theme="dark"] .breadcrumb,
          [data-bs-theme="dark"] .breadcrumb a,
          [data-bs-theme="dark"] .breadcrumb-item,
          [data-bs-theme="dark"] .breadcrumb-item.active {
            color: var(--helium-muted);
          }'''
          css, count = re.subn(
              r'\.breadcrumb \{\n  font-size: 0\.86rem;\n\}',
              new_breadcrumb,
              css,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected one breadcrumb declaration.')
          css_path.write_text(css, encoding='utf-8')

          script_path = Path('scripts/restore-fonts.sh')
          script = script_path.read_text(encoding='utf-8')
          replacements = {
              'manrope-latin-wght-normal.woff2': 'inter-latin-wght-normal.woff2',
              '/fonts/variable/manrope/files/': '/fonts/variable/inter/files/',
              '71eb731d558046199aa7f985adbf812890a093a1': 'd15208de03cd1ad7c5199f0a0ce915fe841e4722',
              'Unexpected Manrope font checksum': 'Unexpected Inter font checksum',
          }
          for old, new in replacements.items():
              if old not in script:
                  raise SystemExit(f'Expected restore-fonts value was not found: {old}')
              script = script.replace(old, new, 1)
          script_path.write_text(script, encoding='utf-8')

      - name: Commit theme changes
        shell: bash
        run: |
          git add templates/helium/public/main.css scripts/restore-fonts.sh
          if git diff --cached --quiet; then
            echo "Typography is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: use Inter and update article typography"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
