name: Refresh homepage inventory

on:
  pull_request:
    paths:
      - 'index.md'
      - 'docfx.json'
      - 'templates/helium/public/main.css'
      - 'templates/helium/public/main.js'
      - '.authoring/front-matter.schema.json'
      - 'articles/contributing/metadata-reference.md'
      - '.github/workflows/refresh-homepage-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Regenerate inventory
        run: python3 scripts/generate_content_inventory.py

      - name: Commit generated inventory
        shell: bash
        run: |
          git add planning/content-inventory.yml planning/url-migration-map.yml planning/content-coverage.md
          if git diff --cached --quiet; then
            echo "Inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh homepage inventory"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
